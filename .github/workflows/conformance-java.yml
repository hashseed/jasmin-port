name: Conformance (original Java)

# Runs the conformance programs against the original Jasmin interpreter to check
# that the expected outputs still match it (spec/08-conformance.md §4). Manual,
# because it clones and compiles the upstream Java sources.
on:
  workflow_dispatch:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: bash spec/conformance/run-conformance.sh java
